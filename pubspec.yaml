name: ui_estructura_espacios_flutter
description: "Porra DAM - Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/escudos/
    - assets/datos/

  fonts:
    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse-Regular.ttf

    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/HostGrotesk-VariableFont_wght.ttf
        - asset: assets/fonts/HostGrotesk-Italic-VariableFont_wght.ttf
          style: italic